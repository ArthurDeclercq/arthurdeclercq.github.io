- title: "TIMS²Rescore: A DDA-PASEF optimized data-driven rescoring pipeline based on MS²Rescore"
  authors: "Arthur Declercq & Robbe Devreese ∙ Jonas Scheid ∙ Caroline Jachmann ∙ Tim Van Den Bossche ∙ Annica Preikschat ∙ David Gomez-Zepeda ∙ Jeewan Babu Rijal ∙ Aurélie Hirschler ∙ Jonathan R Krieger ∙ Tharan Srikumar ∙ George Rosenberger ∙ Dennis Trede ∙ Christine Carapito ∙ Stefan Tenzer ∙ Juliane S Walz ∙ Sven Degroeve ∙ Robbin Bouwmeester ∙ Lennart Martens ∙ Ralf Gabriels"
  venue_label: "Journal"
  venue: "Journal of Proteome Research"
  date: "2025-02"
  first_author: true
  url: "https://pubs.acs.org/doi/10.1021/acs.jproteome.4c00609"
  link_text: "View Manuscript"
  doi: "10.1021/acs.jproteome.4c00609"
  abstract: |
    The high throughput analysis of proteins with mass spectrometry (MS) is highly valuable for understanding human biology, discovering disease biomarkers, identifying therapeutic targets, and exploring pathogen interactions. To achieve these goals, specialized proteomics subfields – such as plasma proteomics, immunopeptidomics, and metaproteomics – must tackle specific analytical challenges, such as an increased identification ambiguity compared to routine proteomics experiments. Technical advancements in MS instrumentation can counter these issues by acquiring more discerning information at higher sensitivity levels, as is exemplified by the incorporation of ion mobility and parallel accumulation - serial fragmentation (PASEF) technologies in timsTOF instruments. In addition, AI-based bioinformatics solutions can help overcome ambiguity issues by integrating more data into the identification workflow. Here, we introduce TIMS2Rescore, a data-driven rescoring workflow optimized for DDA-PASEF data from timsTOF instruments. This platform includes new timsTOF MS2PIP spectrum prediction models and IM2Deep, a new deep learning-based peptide ion mobility predictor. Furthermore, to fully streamline data throughput, TIMS2Rescore directly accepts Bruker raw mass spectrometry data, and search results from ProteoScape and many other search engines, including MS Amanda and PEAKS. We showcase TIMS2Rescore performance on plasma proteomics, immunopeptidomics (HLA class I and II), and metaproteomics data sets. TIMS2Rescore is open-source and freely available at <a href="https://github.com/compomics/tims2rescore" target="_blank" class="abstract-link">https://github.com/compomics/tims2rescore.</a>

- title: "MHCquant2 refines immunopeptidomics tumor antigen discovery"
  authors: "Jonas Scheid ∙ Steffen Lemke ∙ Naomi Hoenisch-Gravel ∙ Anna Dengler ∙ Timo Sachsenberg ∙ Arthur Declerq ∙ Ralf Gabriels ∙ Jens Bauer ∙ Marcel Wacker ∙ Leon Bichmann ∙ Lennart Martens ∙ Marissa L. Dubbelaar ∙ Sven Nahnsen ∙ Juliane S. Walz"
  venue_label: "Journal"
  venue: "Research Square"
  date: "2024-12"
  first_author: false
  url: "https://www.researchsquare.com/article/rs-5560023/v1"
  link_text: "View Manuscript"
  doi: "10.21203/rs.3.rs-5560023/v1"
  abstract: |
    The identification of human leukocyte antigen (HLA)-presented peptides as targets of anti-cancer T cell response is pivotal for the development of novel immunotherapies. Mass spectrometry (MS)-based immunopeptidomics enables the detection of these peptides, yet confident identifications and thus implementation in immunotherapy design are hampered by the high diversity and low abundance of naturally presented HLA peptides. Here, we introduce MHCquant2, a Nextflow-based open-source pipeline that leverages OpenMS tools and peptide property predictors (DeepLC, MS2PIP) for highly sensitive and scalable HLA peptide identification and quantification across various MS platforms. MHCquant2 increased peptide identifications up to 27% with a significant expansion of low-abundant peptides, outperforming state-of-the-art pipelines. Using MHCquant2 we build a comprehensive benign tissue repository comprising re-analyzed data from available benign immunopeptidomes and a novel benignMHCquant2 dataset, adding more than 160,000 novel naturally presented HLA peptides. First applications of this benign repository and the MHCquant2 pipeline enabled (i) the refinement of tumor-associated antigens, (ii) the detection of novel, high-frequent tumor-exclusive peptide antigens for multiple tumor entities, and (iii) the identification and quantification of mutation-derived low-abundant neoepitopes. MHCquant2 refines tumor antigen discovery in immunopeptidomics, paving the way for the implementation of off-the-shelf and personalized immunotherapy design.

- title: "Collisional cross-section prediction for multiconformational peptide ions with IM2Deep"
  authors: "Robbe Devreese ∙ Alireza Nameni ∙ Arthur Declercq, Emmy Terryn ∙ Ralf Gabriels ∙ Francis Impens ∙ Kris Gevaert ∙ Lennart Martens ∙ Robbin Bouwmeester"
  venue_label: "Journal"
  venue: "Biorxiv"
  date: "2025-02"
  first_author: false
  url: "https://www.biorxiv.org/content/10.1101/2025.02.18.638865v1"
  link_text: "View Manuscript"
  doi: "10.1101/2025.02.18.638865"
  abstract: |
    Peptide collisional cross-section (CCS) prediction is complicated by the tendency of peptide ions to exhibit multiple conformations in the gas phase. This adds further complexity to downstream analysis of proteomics data, for example for identification or quantification through feature finding. Here, we present an improved version of IM2Deep that is trained on a carefully curated dataset to predict CCS values of multiconformational peptides. The training data is derived from a large and comprehensive set of publicly available datasets. This comprehensive training dataset together with a tailored architecture allows for the accurate CCS prediction of multiple peptide conformational states. Furthermore, the enhanced IM2Deep model also retains high precision for peptides with a single observed conformation. IM2Deep is publicly available under a permissive open source license at <a href="https://github.com/compomics/IM2Deep" target="_blank" class="manuscript-link">https://github.com/compomics/IM2Deep</a>.

- title: "Boosting metaproteomics identification rates and taxonomic specificity with MS2Rescore"
  authors: "Tim Van Den Bossche ∙ Arthur Declercq ∙ Ralf Gabriels ∙ Tanja Holstein ∙ Bart Mesuere ∙ Thilo Muth ∙ Pieter Verschaffelt ∙ Lennart Martens"
  venue_label: "Journal"
  venue: "Biorxiv"
  date: "2025-02"
  first_author: false
  url: "MANUSCRIPT_LINK"
  link_text: "View Manuscript"
  doi: ""
  abstract: |
    <strong>Background:</strong><br>Metaproteomics, the study of the collective proteome within microbial ecosystems, has gained increasing interest over the past decade. However, peptide identification rates in metaproteomics remain low compared to single-species proteomics. A key challenge is the limited sequence resolution of current identification algorithms, which were primarily designed for single-species analyses. To address this, we applied the machine learning-driven MS2Rescore tool to multiple metaproteomics datasets from diverse microbial environments and benchmark studies.
    <br><strong>Results:</strong><br>We demonstrate that MS2Rescore outperforms typical metaproteomics identification workflows. It significantly increases peptide identification rates compared to standard database searches, even when compared to Percolator rescoring. Moreover, it enables lowering the false discovery rate (FDR) to 0.1% with minimal sensitivity loss, a substantial improvement over the 1% or 5% FDR thresholds commonly used in metaproteomics, in turn leading to greater specificity in downstream taxonomic annotation with Unipept.
    <br><strong>Conclusions:</strong><br> Our findings show that MS2Rescore substantially improves peptide identification sensitivity as well as specificity in metaproteomics, and delivers improved taxonomic specificity. This advancement results in a more reliable downstream taxonomic analysis, reinforcing the potential of machine learning-based rescoring in metaproteomics research.

- title: "Maximizing immunopeptidomics-based bacterial epitope discovery by multiple search engines and rescoring"
  authors: "Patrick Willems ∙ Fabien Thery ∙ Laura Van Moortel ∙ Margaux De Meyer ∙ An Staes ∙ Adillah Gul ∙ Lyudmila Kovalchuke ∙ Arthur Declercq ∙ Robbe Devreese ∙ Robbin Bouwmeester ∙ Ralf Gabriels ∙  Lennart Martens ∙ Francis Impens"
  venue_label: "Journal"
  venue: "Journal of Proteome Research"
  date: "2025-03"
  first_author: false
  url: "https://pubs.acs.org/doi/10.1021/acs.jproteome.4c00864"
  link_text: "View Manuscript"
  doi: "10.1021/acs.jproteome.4c00864"
  abstract: |
    Mass spectrometry-based discovery of bacterial immunopeptides presented by infected cells allows untargeted discovery bacterial antigens that can serve as vaccine candidates. Reliable identification of bacterial epitopes by such immunopeptidomics approaches is however challenged by their extreme low abundance. Here, we describe an optimized bioinformatical framework to enhance the confident identification of bacterial immunopeptides. Immunopeptidomics data of cell cultures infected with the foodborne model pathogen Listeria monocytogenes were searched by four different search engines, PEAKS, Comet, Sage and MSFragger, followed by data-driven rescoring with MS2Rescore. Compared to standard single search-engine results, this integrated workflow boosted the number of identified immunopeptides on average by 27% and led to the high confident detection of 18 additional bacterial peptides (+27%) matching 15 different Listeria proteins (+36%). Despite an overall large agreement between the search engines, a small number of conflicts (< 1%) in spectra-to-peptide assignments revealed ambiguous identifications that served as a quality filter. Finally, we show compatibility of our workflow with sensitive timsTOF data acquisition and find that rescoring, now with inclusion of ion mobility features, identifies 76% more peptides compared to orbitrap-based acquisition. Together, our results demonstrate how integration of multiple search engine results along with data-driven rescoring maximizes the identification of immunopeptides, boosting the detection of high confident bacterial epitopes for vaccine development.

- title: "MS2Rescore: Data-Driven Rescoring Dramatically Boosts Immunopeptide Identification Rates"
  authors: "Arthur Declercq ∙ Robbin Bouwmeester ∙ Aurélie Hirschler ∙ Christine Carapito ∙ Sven Degroeve ∙ Lennart Martens ∙ Ralf Gabriels"
  venue_label: "Journal"
  venue: "Molecular & Cellular Proteomics"
  date: "2022-08"
  first_author: true
  url: "https://www.mcponline.org/article/S1535-9476(22)00074-3/fulltext"
  link_text: "View Manuscript"
  doi: "10.1016/j.mcpro.2022.100266"
  abstract: |
    Immunopeptidomics aims to identify major histocompatibility complex (MHC)-presented peptides on almost all cells that can be used in anti-cancer vaccine development. However, existing immunopeptidomics data analysis pipelines suffer from the nontryptic nature of immunopeptides, complicating their identification. Previously, peak intensity predictions by MS2PIP and retention time predictions by DeepLC have been shown to improve tryptic peptide identifications when rescoring peptide-spectrum matches with Percolator. However, as MS2PIP was tailored toward tryptic peptides, we have here retrained MS2PIP to include nontryptic peptides. Interestingly, the new models not only greatly improve predictions for immunopeptides but also yield further improvements for tryptic peptides. We show that the integration of new MS2PIP models, DeepLC, and Percolator in one software package, MS2Rescore, increases spectrum identification rate and unique identified peptides with 46% and 36% compared to standard Percolator rescoring at 1% FDR. Moreover, MS2Rescore also outperforms the current state-of-the-art in immunopeptide-specific identification approaches. Altogether, MS2Rescore thus allows substantially improved identification of novel epitopes from existing immunopeptidomics workflows.

- title: "MS2Rescore 3.0 Is a Modular, Flexible, and User-Friendly Platform to Boost Peptide Identifications, as Showcased with MS Amanda 3.0"
  authors: "Louise M. Buur & Arthur Declercq ∙ Marina Strobl ∙ Robbin Bouwmeester ∙ Sven Degroeve ∙ Lennart Martens ∙ Viktoria Dorfer & Ralf Gabriels"
  venue_label: "Journal"
  venue: "Journal of Proteome Research"
  date: "2024-03"
  first_author: true
  url: "https://pubs.acs.org/doi/10.1021/acs.jproteome.3c00785"
  link_text: "View Manuscript"
  doi: "10.1021/acs.jproteome.3c00785"
  abstract: |
    Rescoring of peptide–spectrum matches (PSMs) has emerged as a standard procedure for the analysis of tandem mass spectrometry data. This emphasizes the need for software maintenance and continuous improvement for such algorithms. We introduce MS2Rescore 3.0, a versatile, modular, and user-friendly platform designed to increase peptide identifications. Researchers can install MS2Rescore across various platforms with minimal effort and benefit from a graphical user interface, a modular Python API, and extensive documentation. To showcase this new version, we connected MS2Rescore 3.0 with MS Amanda 3.0, a new release of the well-established search engine, addressing previous limitations on automatic rescoring. Among new features, MS Amanda now contains additional output columns that can be used for rescoring. The full potential of rescoring is best revealed when applied on challenging data sets. We therefore evaluated the performance of these two tools on publicly available single-cell data sets, where the number of PSMs was substantially increased, thereby demonstrating that MS2Rescore offers a powerful solution to boost peptide identifications. MS2Rescore's modular design and user-friendly interface make data-driven rescoring easily accessible, even for inexperienced users. We therefore expect the MS2Rescore to be a valuable tool for the wider proteomics community. MS2Rescore is available at <a href="https://github.com/compomics/ms2rescore" target="_blank" class="abstract-link">https://github.com/compomics/ms2rescore.</a>

- title: "Updated MS²PIP web server supports cutting-edge proteomics applications"
  authors: "Arthur Declercq ∙ Robbin Bouwmeester ∙ Cristina Chiva ∙ Eduard Sabidó ∙ Aurélie Hirschler ∙ Christine Carapito ∙ Lennart Martens ∙ Sven Degroeve ∙ Ralf Gabriels"
  venue_label: "Journal"
  venue: "Nucleic Acids Research"
  date: "2023-07"
  first_author: true
  url: "https://academic.oup.com/nar/article/51/W1/W338/7151340?login=false"
  link_text: "View Manuscript"
  doi: "10.1093/nar/gkad335"
  abstract: |
    Interest in the use of machine learning for peptide fragmentation spectrum prediction has been strongly on the rise over the past years, especially for applications in challenging proteomics identification workflows such as immunopeptidomics and the full-proteome identification of data independent acquisition spectra. Since its inception, the MS²PIP peptide spectrum predictor has been widely used for various downstream applications, mostly thanks to its accuracy, ease-of-use, and broad applicability. We here present a thoroughly updated version of the MS²PIP web server, which includes new and more performant prediction models for both tryptic- and non-tryptic peptides, for immunopeptides, and for CID-fragmented TMT-labeled peptides. Additionally, we have also added new functionality to greatly facilitate the generation of proteome-wide predicted spectral libraries, requiring only a FASTA protein file as input. These libraries also include retention time predictions from DeepLC. Moreover, we now provide pre-built and ready-to-download spectral libraries for various model organisms in multiple DIA-compatible spectral library formats. Besides upgrading the back-end models, the user experience on the MS²PIP web server is thus also greatly enhanced, extending its applicability to new domains, including immunopeptidomics and MS3-based TMT quantification experiments. MS²PIP is freely available at <a href="https://iomics.ugent.be/ms2pip/." target="_blank" class="abstract-link">https://iomics.ugent.be/ms2pip.</a>

- title: "Thunder-DDA-PASEF enables high-coverage immunopeptidomics and is boosted by MS2Rescore with MS2PIP timsTOF fragmentation prediction model"
  authors: "David Gomez-Zepeda ∙ Danielle Arnold-Schild ∙ Julian Beyrle ∙ Arthur Declercq ∙ Ralf Gabriels ∙ Elena Kumm ∙ Annica Preikschat ∙ Mateusz Krzysztof Łącki ∙ Aurélie Hirschler ∙ Jeewan Babu Rijal ∙ Christine Carapito ∙ Lennart Martens ∙ Ute Distler ∙ Hansjörg Schild ∙ Stefan Tenzer"
  venue_label: "Journal"
  venue: "Nature Communications"
  date: "2024-03"
  first_author: false
  url: "https://www.nature.com/articles/s41467-024-46380-y"
  link_text: "View Manuscript"
  doi: "10.1038/s41467-024-46380-y"
  abstract: |
    Human leukocyte antigen (HLA) class I peptide ligands (HLAIps) are key targets for developing vaccines and immunotherapies against infectious pathogens or cancer cells. Identifying HLAIps is challenging due to their high diversity, low abundance, and patient individuality. Here, we develop a highly sensitive method for identifying HLAIps using liquid chromatography-ion mobility-tandem mass spectrometry (LC-IMS-MS/MS). In addition, we train a timsTOF-specific peak intensity MS2PIP model for tryptic and non-tryptic peptides and implement it in MS2Rescore (v3) together with the CCS predictor from ionmob. The optimized method, Thunder-DDA-PASEF, semi-selectively fragments singly and multiply charged HLAIps based on their IMS and m/z. Moreover, the method employs the high sensitivity mode and extended IMS resolution with fewer MS/MS frames (300 ms TIMS ramp, 3 MS/MS frames), doubling the coverage of immunopeptidomics analyses, compared to the proteomics-tailored DDA-PASEF (100 ms TIMS ramp, 10 MS/MS frames). Additionally, rescoring boosts the HLAIps identification by 41.7% to 33%, resulting in 5738 HLAIps from as little as one million JY cell equivalents, and 14,516 HLAIps from 20 million. This enables in-depth profiling of HLAIps from diverse human cell lines and human plasma. Finally, profiling JY and Raji cells transfected to express the SARS-CoV-2 spike protein results in 16 spike HLAIps, thirteen of which have been reported to elicit immune responses in human patients.

- title: "Bioinformatics Pipeline for Processing Single-Cell Data"
  authors: "Arthur Declercq ∙ Nina Demeulemeester ∙ Ralf Gabriels ∙ Robbin Bouwmeester ∙ Sven Degroeve ∙ Lennart Martens"
  venue_label: "Book"
  venue: "Mass Spectrometry Based Single Cell Proteomics"
  date: "2024-06"
  first_author: true
  url: "https://link.springer.com/protocol/10.1007/978-1-0716-3934-4_15"
  link_text: "View Book Chapter"
  doi: "10.1007/978-1-0716-3934-4_15"
  abstract: |
    Single-cell proteomics can offer valuable insights into dynamic cellular interactions, but identifying proteins at this level is challenging due to their low abundance. In this chapter, we present a state-of-the-art bioinformatics pipeline for single-cell proteomics that combines the search engine Sage (via SearchGUI), identification rescoring with MS2Rescore, quantification through FlashLFQ, and differential expression analysis using MSqRob2. MS2Rescore leverages LC-MS/MS behavior predictors, such as MS2PIP and DeepLC, to recalibrate scores with Percolator or mokapot. Combining these tools into a unified pipeline, this approach improves the detection of low-abundance peptides, resulting in increased identifications while maintaining stringent FDR thresholds.

- title: "Psm_utils: A high-level Python API for parsing and handling peptide-spectrum matches and proteomics search results"
  authors: "Ralf Gabriels ∙ Arthur Declercq ∙ Robbin Bouwmeester ∙ Sven Degroeve ∙ Lennart Martens"
  venue_label: "Journal"
  venue: "Journal of Proteome Research"
  date: "2022-12"
  first_author: false
  url: "https://pubs.acs.org/doi/abs/10.1021/acs.jproteome.2c00609"
  link_text: "View Manuscript"
  doi: "10.1021/acs.jproteome.2c00609"
  abstract: |
    A plethora of proteomics search engine output file formats are in circulation. This lack of standardized output files greatly complicates generic downstream processing of peptide-spectrum matches (PSMs) and PSM files. While standards exist to solve this problem, these are far from universally supported by search engines. Moreover, software libraries are available to read a selection of PSM file formats, but a package to parse PSM files into a unified data structure has been missing. Here, we present psm_utils, a Python package to read and write various PSM file formats and to handle peptidoforms, PSMs, and PSM lists in a unified and user-friendly Python-, command line-, and web-interface. psm_utils was developed with pragmatism and maintainability in mind, adhering to community standards and relying on existing packages where possible. The Python API and command line interface greatly facilitate handling various PSM file formats. Moreover, a user-friendly web application was built using psm_utils that allows anyone to interconvert PSM files and retrieve basic PSM statistics. psm_utils is freely available under the permissive Apache2 license at <a href="https://github.com/compomics/psm_utils" target="_blank" class="abstract-link">https://github.com/compomics/psm_utils.</a>

- title: "Ionmob: a Python package for prediction of peptide collisional cross-section values"
  authors: "David Teschner ∙ David Gomez-Zepeda ∙ Arthur Declercq ∙ Mateusz K Łącki ∙ Seymen Avci ∙ Konstantin Bob ∙ Ute Distler ∙ Thomas Michna ∙ Lennart Martens ∙ Stefan Tenzer ∙ Andreas Hildebrandt"
  venue_label: "Journal"
  venue: "Bioinformatics"
  date: "2023-08"
  first_author: false
  url: "https://academic.oup.com/bioinformatics/article/39/9/btad486/7237255"
  link_text: "View Manuscript"
  doi: "10.1093/bioinformatics/btad486"
  abstract: |
    Including ion mobility separation (IMS) into mass spectrometry proteomics experiments is useful to improve coverage and throughput. Many IMS devices enable linking experimentally derived mobility of an ion to its collisional cross-section (CCS), a highly reproducible physicochemical property dependent on the ion's mass, charge and conformation in the gas phase. Thus, known peptide ion mobilities can be used to tailor acquisition methods or to refine database search results. The large space of potential peptide sequences, driven also by posttranslational modifications of amino acids, motivates an in silico predictor for peptide CCS. Recent studies explored the general performance of varying machine-learning techniques, however, the workflow engineering part was of secondary importance. For the sake of applicability, such a tool should be generic, data driven, and offer the possibility to be easily adapted to individual workflows for experimental design and data processing. We created ionmob, a Python-based framework for data preparation, training, and prediction of collisional cross-section values of peptides. It is easily customizable and includes a set of pretrained, ready-to-use models and preprocessing routines for training and inference. Using a set of ≈21 000 unique phosphorylated peptides and ≈17 000 MHC ligand sequences and charge state pairs, we expand upon the space of peptides that can be integrated into CCS prediction. Lastly, we investigate the applicability of in silico predicted CCS to increase confidence in identified peptides by applying methods of re-scoring and demonstrate that predicted CCS values complement existing predictors for that task. The Python package is available at github: <a href="https://github.com/theGreatHerrLebert/ionmob" target="_blank" class="abstract-link">https://github.com/theGreatHerrLebert/ionmob.</a>

- title: "Quality control for the target decoy approach for peptide identification"
  authors: "Elke Debrie ∙ Milan Malfait ∙ Ralf Gabriels ∙ Arthur Declercq ∙ Adriaan Sticker ∙ Lennart Martens ∙ Lieven Clement"
  venue_label: "Journal"
  venue: "Journal of Proteome Research"
  date: "2023-01"
  first_author: false
  url: "https://pubs.acs.org/doi/abs/10.1021/acs.jproteome.2c00423"
  link_text: "View Manuscript"
  doi: "10.1021/acs.jproteome.2c00423"
  abstract: |
    Reliable peptide identification is key in mass spectrometry (MS) based proteomics. To this end, the target decoy approach (TDA) has become the cornerstone for extracting a set of reliable peptide-to-spectrum matches (PSMs) that will be used in downstream analysis. Indeed, TDA is now the default method to estimate the false discovery rate (FDR) for a given set of PSMs, and users typically view it as a universal solution for assessing the FDR in the peptide identification step. However, the TDA also relies on a minimal set of assumptions, which are typically never verified in practice. We argue that a violation of these assumptions can lead to poor FDR control, which can be detrimental to any downstream data analysis. We here therefore first clearly spell out these TDA assumptions, and introduce TargetDecoy, a Bioconductor package with all the necessary functionality to control the TDA quality and its underlying assumptions for a given set of PSMs.

- title: "Intensity and retention time prediction improves the rescoring of protein-nucleic acid cross-links"
  authors: "Arslan Siraj ∙ Robbin Bouwmeester ∙ Arthur Declercq ∙ Luisa Welp ∙ Aleksandar Chernev ∙ Alexander Wulf ∙ Henning Urlaub ∙ Lennart Martens ∙ Sven Degroeve ∙ Oliver Kohlbacher ∙ Timo Sachsenberg"
  venue_label: "Journal"
  venue: "Proteomics"
  date: "2024-04"
  first_author: false
  url: "https://analyticalsciencejournals.onlinelibrary.wiley.com/doi/full/10.1002/pmic.202300144"
  link_text: "View Manuscript"
  doi: "10.1002/pmic.202300144"
  abstract: |
    In protein-RNA cross-linking mass spectrometry, UV or chemical cross-linking introduces stable bonds between amino acids and nucleic acids in protein-RNA complexes that are then analyzed and detected in mass spectra. This analytical tool delivers valuable information about RNA-protein interactions and RNA docking sites in proteins, both in vitro and in vivo. The identification of cross-linked peptides with oligonucleotides of different length leads to a combinatorial increase in search space. We demonstrate that the peptide retention time prediction tasks can be transferred to the task of cross-linked peptide retention time prediction using a simple amino acid composition encoding, yielding improved identification rates when the prediction error is included in rescoring. For the more challenging task of including fragment intensity prediction of cross-linked peptides in the rescoring, we obtain, on average, a similar improvement. Further improvement in the encoding and fine-tuning of retention time and intensity prediction models might lead to further gains, and merit further research.

- title: "Transfer learning in DeepLC improves LC retention time prediction across substantially different modifications and setups"
  authors: "Robbin Bouwmeester ∙ Alireza Nameni ∙ Arthur Declercq ∙ Robbe Devreese ∙ Kevin Velghe ∙ Vladimir Gorshkov ∙ Pelayo A. Penanes ∙ Frank kjeldsen ∙ Magali Rompais ∙ Christine Carapito ∙ Ralf Gabriels & Lennart Martens"
  venue_label: "Journal"
  venue: "Nature Communications"
  date: "2026-02"
  first_author: false
  url: "https://www.nature.com/articles/s41467-026-68981-5"
  link_text: "View Manuscript"
  doi: "10.1038/s41467-026-68981-5"
  abstract: |
    While LC retention time prediction of peptides and their modifications has proven useful, widespread adoption and optimal performance are hindered by variations in experimental parameters. These variations can render retention time prediction models inaccurate and dramatically reduce the value of predictions for identification, validation, and DIA spectral library generation. To date, mitigation of these issues has been attempted through calibration or by training bespoke models for specific experimental setups, with only partial success. We here demonstrate that transfer learning can successfully overcome these limitations by leveraging pre-trained model parameters. Remarkably, this approach can even fit highly performant models to substantially different peptide modifications and LC conditions than those on which the model was originally trained. This impressive adaptability of transfer learning makes it a highly robust solution for accurate peptide retention time prediction across a very wide variety of imaginable proteomics workflows.
