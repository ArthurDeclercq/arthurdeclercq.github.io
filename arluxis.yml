# Photos on the arluxis page (arluxis.qmd), rendered by scripts/render_arluxis.py.
#
# The image folder decides the gallery: landscape_photography -> Nature,
# sports_photography -> Sports, street_photography -> Street. Order in this
# file does not matter; each gallery is shown newest first by `taken`, after
# any photos that have an `order` number.
#
# Add photos with: python scripts/add_arluxis_photos.py
# That script makes the WebP preview and fills in the camera details below.
#
# Optional keys per photo:
#   order: 1            show at the top of its gallery, lowest number first
#   alt: text           describe the photo for screen readers (default: place and month)
#   pair_with: DSCF1234 show next to this photo instead of the automatic pairing
#   single: true        never pair this photo
#   pair_at: older      place the pair where its older photo falls

